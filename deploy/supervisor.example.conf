# Supervisor example: /etc/supervisor/conf.d/<your-project>-worker.conf
#
# Queue workers are REQUIRED, not optional: admin broadcast emails and the
# provider onboarding journey are dispatched as queued jobs. With no worker
# running, they pile up silently in the `jobs` table and nothing reports an
# error.
#
# The path goes through `current`, not a release directory, so that after
# `php artisan queue:restart` the worker exits, Supervisor restarts it, and it
# picks up whichever release the symlink now points at. Pointing this at a flat
# project directory (or at a specific release) leaves workers running old code
# forever.

[program:<your-project>-worker]
command=php /var/www/<your-project>/current/artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600
directory=/var/www/<your-project>/current
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
user=www-data
numprocs=2

# Longer than the job --timeout above, so a graceful stop never severs a job
# that is still within its allowed run time.
stopwaitsecs=120

redirect_stderr=true
stdout_logfile=/var/www/<your-project>/shared/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
