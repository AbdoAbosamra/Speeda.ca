name: Speeda CI/CD

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"
  workflow_dispatch:

# contents: write is needed to publish the built Vite assets as a release
# asset, which is how the server obtains them (it runs Node 18; the toolchain
# needs 20+, so it cannot build them itself).
permissions:
  contents: write

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "22"
  DEFAULT_DEPLOY_BRANCH: "main"
  # Floor for the "did the suite actually run" guard below. Kept well under the
  # real count so adding or removing a few tests never trips it; it only catches
  # the failure mode where the suite silently collapses to (almost) nothing.
  MIN_TESTS: "250"

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, ctype, dom, fileinfo, gd, intl, mbstring, mysql, pdo_mysql, pdo_sqlite, sqlite3, tokenizer, xml, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ansi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare isolated Laravel environment
        run: |
          cp .env.example .env
          touch database/ci.sqlite
          php artisan key:generate --ansi
          php artisan config:clear --ansi
          php artisan migrate --force --ansi
        env:
          APP_ENV: testing
          APP_DEBUG: "true"
          AUTO_CREATE_ADMIN: "false"
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/ci.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array

      - name: Validate Laravel config, routes, and views
        run: |
          php artisan config:cache --ansi
          php artisan route:list --ansi
          php artisan view:cache --ansi
          php artisan optimize:clear --ansi
        env:
          APP_ENV: testing
          APP_DEBUG: "true"
          AUTO_CREATE_ADMIN: "false"
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/ci.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array

      - name: Build Vite assets
        run: npm run build

      - name: Run Laravel tests
        run: |
          if find tests -name '*Test.php' -print -quit | grep -q .; then
            mkdir -p test-reports

            # No --testsuite flag: runs every suite in phpunit.xml (Unit, Feature,
            # Security). The old "All" suite was removed from phpunit.xml, so
            # --testsuite=All matched nothing and passed with zero tests run.
            php artisan test --ansi --log-junit=test-reports/junit.xml

            # A green CI that executed nothing is worse than a red one: it hid a
            # broken test step for weeks. Assert the suite actually ran.
            count=$(php -r '$x=@simplexml_load_file("test-reports/junit.xml"); $t=0; if($x){foreach($x->testsuite as $s){$t+=(int)$s["tests"];}} echo $t;')
            echo "Executed ${count} tests"
            echo "Executed ${count} tests" >> "$GITHUB_STEP_SUMMARY"

            if [ "${count:-0}" -lt "$MIN_TESTS" ]; then
              echo "::error::Expected at least ${MIN_TESTS} tests to run, but only ${count:-0} did."
              exit 1
            fi
          else
            echo "No Laravel tests found; skipping."
          fi
        env:
          APP_ENV: testing
          APP_DEBUG: "true"
          AUTO_CREATE_ADMIN: "false"
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/ci.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array

  publish-build:
    name: Publish build artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref_name == (vars.DEPLOY_BRANCH || 'main') }}
    concurrency:
      group: speeda-publish-build
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      # The server pulls this over plain HTTPS. It cannot build the assets
      # itself: it runs Node 18 and the toolchain needs 20+.
      - name: Package assets
        run: |
          set -euo pipefail
          tar -czf build.tar.gz public/build
          sha256sum build.tar.gz | awk '{print $1}' > build.tar.gz.sha256
          echo "Packaged $(du -h build.tar.gz | cut -f1)"

      # Deployment transport is PULL, not push. GitHub-hosted runners could not
      # reliably SSH to the server: fail2ban is active there and drops packets
      # from runner IPs, which rotate across ranges too wide to allowlist.
      # Publishing here and letting the server fetch removes the inbound
      # dependency entirely, along with the need to store an SSH key in CI.
      - name: Publish build for the server to pull
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_SHA}"
          gh release create "$TAG" --title "$TAG" --notes "Vite assets for ${GITHUB_SHA}" --target "$GITHUB_SHA" 2>/dev/null \
            || echo "release $TAG already exists"
          gh release upload "$TAG" build.tar.gz build.tar.gz.sha256 --clobber
          echo "Published $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment instructions
        run: |
          {
            echo "### Ready to deploy"
            echo ""
            echo "Run on the server as \`speeda\`:"
            echo ""
            echo '```bash'
            echo "/home/speeda/deploy/pull-deploy.sh ${GITHUB_SHA}"
            echo '```'
            echo ""
            echo "HOLD_SWITCH gates the cutover; while it exists the release is only prepared."
          } >> "$GITHUB_STEP_SUMMARY"
