# nginx example for /etc/nginx/sites-available/<your-project>
#
# Written for the release/symlink layout the CI/CD pipeline deploys:
#
#   PROJECT_PATH/
#     current -> releases/<active-release>
#     releases/
#     shared/{.env,storage}
#
# Two settings below are what make zero-downtime deploys actually work.
# Getting either wrong produces the same confusing symptom: the deploy reports
# success, but the site keeps serving the previous release.

server {
    listen 80;
    server_name example.com www.example.com;

    # Point at the SYMLINK, never at a specific release directory — the
    # deployment swaps this symlink atomically.
    root /var/www/<your-project>/current/public;
    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;

        # Match the PHP version the app is built against (CI uses 8.4).
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;

        # The include comes FIRST and the overrides after it, because nginx
        # sends every fastcgi_param it is given and PHP keeps the last value.
        # /etc/nginx/fastcgi_params defines DOCUMENT_ROOT as $document_root, so
        # including it below these lines would quietly put the symlink path
        # back and undo half of the override.
        include fastcgi_params;

        # CRITICAL for zero downtime: $realpath_root, NOT $document_root.
        #
        # $document_root keeps the symlink path (".../current/public"), so
        # every release looks like the same file to PHP's opcache and FPM
        # happily keeps executing the OLD release's cached opcode after the
        # symlink is swapped. $realpath_root resolves through the symlink to
        # ".../releases/<name>/public", giving each release its own cache
        # keys — new code takes effect the instant the symlink moves, with no
        # opcache reset and no dropped requests.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
    }

    location ~ /\.ht {
        deny all;
    }

    # Long-lived caching for Vite's content-hashed build assets.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Three separate ceilings decide whether an upload survives, and the
    # smallest one wins: this, PHP's post_max_size, and PHP's
    # upload_max_filesize. Set nginx no lower than post_max_size, or nginx
    # returns a bare 413 before PHP is ever reached and the application cannot
    # explain what happened. `php artisan deploy:verify` checks the PHP pair;
    # it cannot see this line, so keep them in step by hand.
    #
    #   upload_max_filesize = 16M   (a gallery image may be 10M)
    #   post_max_size       = 64M   (every upload field filled at once)
    #   client_max_body_size  64M   (this line — matches post_max_size)
    client_max_body_size 64M;

    access_log /var/log/nginx/<your-project>.access.log;
    error_log /var/log/nginx/<your-project>.error.log;
}
