# Supervisor example: /etc/supervisor/conf.d/<your-project>-worker.conf
[program:<your-project>-worker]
command=php /var/www/<your-project>/artisan queue:work --sleep=3 --tries=3 --timeout=90
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/<your-project>/storage/logs/worker.log
